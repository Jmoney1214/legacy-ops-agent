name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        id: unittest
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload unit-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-output-${{ matrix.python-version }}
          path: test-output.txt
          if-no-files-found: error
          retention-days: 7
      - name: Fail on unit-test error
        if: steps.unittest.outputs.exit_code != '0'
        run: exit 1
      - name: Compile source
        run: python -m compileall -q legacy_ops browser_automation

  build-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build-control dependency
        run: python -m pip install --upgrade pip && pip install "PyYAML>=6.0.2,<7"
      - name: Compile validator
        run: python -m py_compile scripts/validate_build_control_pack.py
      - name: Validate build-control artifacts
        run: python scripts/validate_build_control_pack.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag legacy-ops-agent:ci .
