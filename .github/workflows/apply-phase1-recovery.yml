name: Apply Phase 1 Recovery

on:
  push:
    branches:
      - build/agent-platform-phase-1
    paths:
      - .github/workflows/apply-phase1-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: build/agent-platform-phase-1
          fetch-depth: 0

      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase1-recovery/chunk01 \
              .phase1-recovery/chunk02 \
              .phase1-recovery/chunk03 \
              .phase1-recovery/chunk04 \
              .phase1-recovery/chunk05 \
              .phase1-recovery/chunk06 \
              .phase1-recovery/chunk07 \
              .phase1-recovery/chunk08 \
            | base64 --decode > /tmp/phase1_payload.tar.gz
          test "$(sha256sum /tmp/phase1_payload.tar.gz | awk '{print $1}')" = "fbafa21c1e33d4cf2a5893e38c9767813e83482be9e1e1ead6800da1caeda8df"
          if tar -tzf /tmp/phase1_payload.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          tar -xzf /tmp/phase1_payload.tar.gz

      - name: Verify synchronized build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python -m compileall -q legacy_ops agent_templates/standard_agent

      - name: Remove recovery transport and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase1-recovery
          rm -f .github/workflows/apply-phase1-recovery.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 1: synchronize reviewed agent platform"
          git push origin HEAD:build/agent-platform-phase-1
